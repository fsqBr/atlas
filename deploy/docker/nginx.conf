# Atlas Web: static SPA + same-origin proxy to the API (no CORS, API stays internal).
# This file is an nginx envsubst template: ATLAS_API_UPSTREAM defaults to atlas-api:8080 (compose) and is set
# to the API Service name by the Helm chart.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the UI; the report is rendered server-side and embedded in an iframe from this origin.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Browser uploads (zipped folders) can be large.
    client_max_body_size 1024m;

    # Re-resolve the API name on every request window: containers change IP on restart (compose) and a
    # cached address would answer 502 until nginx restarts. ATLAS_DNS_RESOLVER: Docker's embedded DNS by
    # default; kube-dns in the Helm chart.
    resolver ${ATLAS_DNS_RESOLVER} valid=10s ipv6=off;
    set $atlas_api http://${ATLAS_API_UPSTREAM};

    location /api/ {
        proxy_pass $atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /health/ {
        proxy_pass $atlas_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
