{{- if .Values.postgresql.bundled }}
# Bundled PostgreSQL: one replica, one PVC. Fine for pilots; use a managed instance for production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "atlas.fullname" . }}-postgres
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "atlas.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "atlas.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "atlas.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.secretName" . }}
                  key: dbPassword
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits: { cpu: "2", memory: 2Gi }
            requests: { cpu: 250m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.fullname" . }}-postgres
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "atlas.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
{{- end }}
{{- if .Values.minio.bundled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}-minio
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "atlas.selector" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "atlas.selector" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: MINIO_ROOT_USER
              value: atlas
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.secretName" . }}
                  key: minioPassword
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits: { cpu: "1", memory: 1Gi }
            requests: { cpu: 100m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "atlas.fullname" . }}-minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "atlas.fullname" . }}-minio
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.minio.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.fullname" . }}-minio
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "atlas.selector" . | nindent 4 }}
    app.kubernetes.io/component: minio
  ports:
    - { name: s3, port: 9000 }
    - { name: console, port: 9001 }
{{- end }}
{{- if .Values.ollama.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}-ollama
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "atlas.selector" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "atlas.selector" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: http
              containerPort: 11434
          # Pull the model once the server answers; idempotent on restarts.
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "for i in $(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 2; done; ollama pull {{ .Values.ollama.model }} || true"]
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "atlas.fullname" . }}-ollama
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "atlas.fullname" . }}-ollama
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.ollama.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.fullname" . }}-ollama
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  selector:
    {{- include "atlas.selector" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - name: http
      port: 11434
{{- end }}
{{- if .Values.pdf.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}-pdf
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "atlas.selector" . | nindent 6 }}
      app.kubernetes.io/component: pdf
  template:
    metadata:
      labels:
        {{- include "atlas.selector" . | nindent 8 }}
        app.kubernetes.io/component: pdf
    spec:
      containers:
        - name: gotenberg
          image: {{ .Values.pdf.image }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pdf.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.fullname" . }}-pdf
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdf
spec:
  selector:
    {{- include "atlas.selector" . | nindent 4 }}
    app.kubernetes.io/component: pdf
  ports:
    - name: http
      port: 3000
{{- end }}
