{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas.fullname" . }}-secrets
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  masterKey: {{ required "secrets.masterKey is required (openssl rand -base64 32) unless secrets.existingSecret is set" .Values.secrets.masterKey | quote }}
  hmacKey: {{ required "secrets.hmacKey is required (openssl rand -base64 32) unless secrets.existingSecret is set" .Values.secrets.hmacKey | quote }}
  dbPassword: {{ required "secrets.dbPassword is required unless secrets.existingSecret is set" .Values.secrets.dbPassword | quote }}
  minioPassword: {{ .Values.secrets.minioPassword | default .Values.secrets.dbPassword | quote }}
{{- end }}
