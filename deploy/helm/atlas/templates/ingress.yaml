{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    # Browser uploads can be large; raise the body limit on nginx-ingress (other controllers: see their docs).
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # The web image proxies /api itself, so one backend is enough; exposing the API directly is also fine.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "atlas.fullname" . }}-web
                port:
                  name: http
{{- end }}
