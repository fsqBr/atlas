apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}-api
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "atlas.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "atlas.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "atlas.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/atlas-api:{{ include "atlas.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Atlas__AutoMigrate
              value: {{ .Values.api.autoMigrate | quote }}
            - name: Atlas__Vulnerabilities__SyncEnabled
              value: {{ .Values.api.vulnerabilitySync | quote }}
            - name: Atlas__Operations__MetricsEnabled
              value: "true"
            - name: Atlas__Operations__AuditEnabled
              value: "true"
            - name: Atlas__Operations__RateLimitPerMinute
              value: {{ .Values.api.rateLimitPerMinute | quote }}
            {{- if .Values.ollama.enabled }}
            - name: Atlas__Ai__LocalOllamaUrl
              value: http://{{ include "atlas.fullname" . }}-ollama:11434
            - name: Atlas__Ai__LocalModel
              value: {{ .Values.ollama.model | quote }}
            {{- end }}
            {{- if .Values.pdf.enabled }}
            - name: Atlas__Report__PdfServiceUrl
              value: http://{{ include "atlas.fullname" . }}-pdf:3000
            {{- end }}
            - name: Atlas__Auth__Enabled
              value: {{ .Values.auth.enabled | quote }}
            - name: Atlas__Auth__Authority
              value: {{ .Values.auth.authority | quote }}
            - name: Atlas__Auth__ClientId
              value: {{ .Values.auth.clientId | quote }}
            - name: Atlas__Auth__Audience
              value: {{ .Values.auth.audience | quote }}
            - name: Atlas__Auth__RoleClaim
              value: {{ .Values.auth.roleClaim | quote }}
            - name: Atlas__Auth__AdminRole
              value: {{ .Values.auth.adminRole | quote }}
            - name: Atlas__Auth__AnalystRole
              value: {{ .Values.auth.analystRole | quote }}
            - name: Atlas__Tenants__Claim
              value: {{ .Values.tenants.claim | quote }}
            - name: Atlas__Tenants__AllowUnmappedUsers
              value: {{ .Values.tenants.allowUnmappedUsers | quote }}
            {{- include "atlas.sharedEnv" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vulndata
              mountPath: /var/atlas/vulndata
            - name: uploads
              mountPath: /var/atlas/uploads
            {{- include "atlas.localSourceMounts" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: vulndata
          persistentVolumeClaim:
            claimName: {{ include "atlas.fullname" . }}-vulndata
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "atlas.fullname" . }}-uploads
        {{- include "atlas.localSourceVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.fullname" . }}-api
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "atlas.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
