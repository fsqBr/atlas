name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from the matching CHANGELOG.md section; the commit list is the fallback.
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" 'index($0, tag) == 1 {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md)
          if [ -z "$notes" ]; then
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$previous" ]; then notes=$(git log --pretty='- %s' "$previous..${GITHUB_REF_NAME}"); else notes=$(git log --pretty='- %s' -n 30); fi
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          printf 'Images: `ghcr.io/%s/atlas-{api,worker,web}:%s`\n\n%s\n' "$owner" "${GITHUB_REF_NAME#v}" "$notes" > notes.md
          # Idempotent: a re-pushed tag (e.g. a sanitized snapshot re-release) updates the existing release.
          gh release create "$GITHUB_REF_NAME" --title "Atlas $GITHUB_REF_NAME" --notes-file notes.md \
            || gh release edit "$GITHUB_REF_NAME" --title "Atlas $GITHUB_REF_NAME" --notes-file notes.md

  # atlas-agent: the opt-in developer CLI, attached to the release as self-contained single-file binaries.
  agent-binaries:
    runs-on: ubuntu-latest
    needs: release-notes
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish atlas-agent (${{ matrix.rid }})
        run: |
          dotnet publish src/Atlas.Agent/Atlas.Agent.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/${{ matrix.rid }}
          cd out/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*) zip -j "../atlas-agent-${GITHUB_REF_NAME}-${{ matrix.rid }}.zip" atlas-agent.exe ;;
            *)     tar -czf "../atlas-agent-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" atlas-agent ;;
          esac
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/atlas-agent-* --clobber
