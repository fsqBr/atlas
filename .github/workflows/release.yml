name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from the matching CHANGELOG.md section; the commit list is the fallback.
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" 'index($0, tag) == 1 {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md)
          if [ -z "$notes" ]; then
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$previous" ]; then notes=$(git log --pretty='- %s' "$previous..${GITHUB_REF_NAME}"); else notes=$(git log --pretty='- %s' -n 30); fi
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          printf 'Images: `ghcr.io/%s/atlas-{api,worker,web}:%s`\n\n%s\n' "$owner" "${GITHUB_REF_NAME#v}" "$notes" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Atlas $GITHUB_REF_NAME" --notes-file notes.md
